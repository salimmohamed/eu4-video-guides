name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "guides/**"
      - "reference/**"
      - "eu4guide/site.html"
      - "eu4guide/guide.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The site build is stdlib only, so skip installing the OCR and video dependencies.
      - run: python -c "from eu4guide.guide import build_site; print(build_site())"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
