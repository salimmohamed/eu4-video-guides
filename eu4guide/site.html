<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EU4 Playbooks</title>
<meta name="description" content="Era-by-era EU4 playbooks built from YouTube guides, with the in-game date for every step.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: site header with nation tabs; one reading column per nation (sticky progress + era jump); shared reference charts at the bottom */
:root{
  --bg:#f3f2ef; --surface:#ffffff; --fg:#22201f; --muted:#6b6560; --line:#dcd8d2;
  --accent:#8e1b24; --gold:#8a6a1f; --wait:#2f5d7c; --wait-bg:#e6eef4; --done:#8a857f;
  --display:"Cinzel",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161a; --surface:#211f24; --fg:#ece8e3; --muted:#a39d96; --line:#36333a;
  --accent:#e0676f; --gold:#d6ad55; --wait:#8cbad8; --wait-bg:#1f2a33; --done:#7c7680; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17161a; --surface:#211f24; --fg:#ece8e3; --muted:#a39d96; --line:#36333a;
  --accent:#e0676f; --gold:#d6ad55; --wait:#8cbad8; --wait-bg:#1f2a33; --done:#7c7680; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 64px}
.site{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding-bottom:10px}
.site .brand{font:700 1rem var(--display);letter-spacing:.06em;color:var(--fg);text-decoration:none}
.site .count{font:500 .78rem var(--mono);color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line);margin-inline:-2px;padding-inline:2px}
.tabs a{flex:none;font:600 .82rem var(--body);letter-spacing:.02em;color:var(--muted);text-decoration:none;padding:8px 12px 9px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
header.nation{margin-top:22px}
header.nation h1{font-family:var(--display);font-size:1.9rem;letter-spacing:.02em;margin:0;text-wrap:balance;color:var(--accent)}
header.nation p{margin:.35rem 0 0;color:var(--muted);max-width:62ch}
header.nation a{color:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);margin-top:18px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.track{flex:1 1 200px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--gold);transition:width .25s}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
nav.eras{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
nav.eras a{flex:none;font:500 .75rem var(--mono);color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}
nav.eras a:hover,nav.eras a:focus-visible{color:var(--fg);border-color:var(--muted)}
nav.eras a.full{color:var(--done);text-decoration:line-through}
nav.eras a.ref{border-style:dashed}
button{font:500 .85rem var(--body);background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,a:focus-visible,input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
button.danger{color:var(--accent);border-color:var(--accent)}
.confirm{display:flex;gap:8px;align-items:center;font-size:.85rem}
section{margin-top:30px;scroll-margin-top:120px}
section h2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 4px;font-family:var(--display);font-size:1.1rem;letter-spacing:.03em}
section h2 .num{font-size:.8rem}
.era{font:600 .75rem var(--mono);letter-spacing:.06em;color:var(--gold);margin-bottom:4px}
.intro{margin:0 0 8px;color:var(--muted);font-size:.88rem;max-width:65ch}
ul.steps{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.steps li{border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
ul.steps li.w{background:var(--wait-bg)}
label{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;padding:9px 2px;cursor:pointer}
input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:none;width:18px;height:18px;margin-top:2px;border:1.5px solid var(--muted);border-radius:4px;display:grid;place-items:center}
li.w .box,.box.round{border-radius:50%;border-color:var(--wait)}
input:checked+.box{background:var(--accent);border-color:var(--accent)}
li.w input:checked+.box{background:var(--wait);border-color:var(--wait)}
input:checked+.box::after{content:"";width:5px;height:9px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.t{min-width:0}
.tag{font:600 .68rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--wait);margin-right:6px}
input:checked~.t{color:var(--done);text-decoration:line-through;text-decoration-color:var(--line)}
.note{display:block;font-size:.82rem;color:var(--muted)}
input:checked~.t .note,input:checked~.t .tag{color:var(--done)}
.when{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding:9px 2px 9px 0;text-align:right}
.when .d{font:500 .75rem var(--mono);color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.when a{font:500 .72rem var(--mono);color:var(--muted);text-decoration:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.when a:hover{color:var(--accent);text-decoration:underline}
.hide-done li.is-done{display:none}
#reference{margin-top:48px;padding-top:6px;border-top:2px solid var(--line)}
#reference > h2{font-size:1.25rem}
#reference > p{margin:0 0 4px;color:var(--muted);font-size:.88rem}
figure{margin:22px 0 0}
/* charts are dense 16:9 images: let them break out of the reading column on wide screens */
@media (min-width:880px){figure{position:relative;left:50%;width:min(1200px,calc(100vw - 64px));transform:translateX(-50%)}}
figure h3{margin:0 0 8px;font:600 .95rem var(--body)}
figure a.img{display:block;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#1d2733}
figure img{display:block;width:100%;height:auto;aspect-ratio:16/9}
figcaption{margin-top:6px;font-size:.82rem;color:var(--muted)}
footer{margin-top:36px;font-size:.8rem;color:var(--muted)}
.empty{margin-top:40px;color:var(--muted)}
@media (max-width:480px){.when .d{font-size:.7rem}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
@media print{
  :root{--bg:#fff;--fg:#000;--muted:#444;--line:#bbb;--wait-bg:#eef3f7;color-scheme:light}
  .bar,.tabs,.site,footer{display:none}
  body{font-size:11pt}
  li{break-inside:avoid}
  figure{break-inside:avoid}
}
</style>
</head><body>
<div class="wrap">
  <div class="site"><a class="brand" href="#">EU4 Playbooks</a><span class="count" id="libcount"></span></div>
  <nav class="tabs" id="tabs" aria-label="Nations"></nav>
  <main id="guide"></main>
<!--REFERENCE-->
  <footer>Dates are read off the in-game clock in each video. Your timing will drift a few years depending on events and alliances in your game. Ticks are saved in this browser only.</footer>
</div>
<script>
const GUIDES=/*GUIDES*/[];
const HAS_REFS=!!document.getElementById("reference");
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const ts=s=>s>=3600?`${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`:`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const smooth=()=>matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth";
const load=k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return {}}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

// Nation tabs
const tabs=document.getElementById("tabs"),main=document.getElementById("guide");
document.getElementById("libcount").textContent=`${GUIDES.length} ${GUIDES.length===1?"nation":"nations"}`;
GUIDES.forEach(g=>{const a=el("a",null,g.nation);a.href=`#${g.slug}`;a.dataset.slug=g.slug;tabs.append(a)});

function show(slug){
  const g=GUIDES.find(x=>x.slug===slug)||GUIDES[0];
  tabs.querySelectorAll("a").forEach(a=>{if(g&&a.dataset.slug===g.slug)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  main.replaceChildren();
  if(!g){main.append(el("p","empty","No playbooks yet."));return}
  document.title=`${g.nation} Playbook · EU4 Playbooks`;
  const V=g.video.id,KEY=`eu4-guide-${g.slug}-v1`;let state=load(KEY);

  const head=el("header","nation");head.append(el("h1",null,`${g.nation} Playbook`));
  const sub=el("p");sub.append(`${g.summary} From `);
  const src=el("a",null,`${g.video.channel?g.video.channel+"'s":"the"} ${g.nation} guide`);src.href=`https://youtu.be/${V}`;src.target="_blank";src.rel="noopener";
  sub.append(src,". Each step shows the in-game date it happened in the video and links to that moment.");head.append(sub);
  const lg=el("div","legend");
  const l1=el("span");l1.append(el("span","box"),"Do it");
  const l2=el("span");l2.append(el("span","box round"),"Wait for this to happen");
  const l3=el("span");const d=el("span",null,"Nov 1444");d.style.cssText="font-family:var(--mono);color:var(--gold)";l3.append(d,"date on screen in the video");
  lg.append(l1,l2,l3);head.append(lg);main.append(head);

  const bar=el("div","bar"),row=el("div","row"),track=el("div","track"),fill=el("div","fill"),total=el("span","num");
  track.append(fill);
  const tg=el("button",null,"Hide done");tg.type="button";
  const rs=el("button",null,"Reset");rs.type="button";
  const cf=el("span","confirm");cf.hidden=true;cf.append("Clear every tick for this nation? ");
  const yes=el("button","danger","Clear");yes.type="button";const no=el("button",null,"Cancel");no.type="button";cf.append(yes,no);
  row.append(track,total,tg,rs,cf);
  const eras=el("nav","eras");eras.setAttribute("aria-label","Jump to era");
  bar.append(row,eras);main.append(bar);
  main.classList.remove("hide-done");

  g.phases.forEach((p,pi)=>{
    const s=el("section");s.id=`${g.slug}-era${pi}`;
    s.append(el("div","era",p.era));
    const h2=el("h2");h2.append(el("span",null,p.name));const c=el("span","num");c.dataset.c=pi;h2.append(c);s.append(h2);
    if(p.intro)s.append(el("p","intro",p.intro));
    const a=el("a",null,p.jump);a.href=`#${g.slug}`;a.title=p.name;a.dataset.n=pi;
    a.onclick=ev=>{ev.preventDefault();s.scrollIntoView({behavior:smooth()})};eras.append(a);
    const ul=el("ul","steps");
    p.steps.forEach((st,ii)=>{
      const id=`${g.slug}-c${pi}-${ii}`,sk=`c${pi}-${ii}`,li=el("li",st.wait?"w":null);
      const lab=el("label");lab.htmlFor=id;
      const cb=el("input");cb.type="checkbox";cb.id=id;
      const t=el("span","t");if(st.wait)t.append(el("span","tag","Wait for"));t.append(st.text);
      if(st.note)t.append(el("span","note",st.note));
      lab.append(cb,el("span","box"),t);
      const w=el("span","when");w.append(el("span","d",st.date));
      const v=el("a",null,`▶ ${ts(st.t)}`);v.href=`https://youtu.be/${V}?t=${st.t}`;v.target="_blank";v.rel="noopener";v.setAttribute("aria-label",`Watch at ${ts(st.t)}`);
      w.append(v);li.append(lab,w);
      cb.checked=!!state[sk];li.classList.toggle("is-done",cb.checked);
      cb.addEventListener("change",()=>{state[sk]=cb.checked;li.classList.toggle("is-done",cb.checked);store(KEY,state);update()});
      ul.append(li);
    });
    s.append(ul);main.append(s);
  });
  if(HAS_REFS){const a=el("a","ref","Reference");a.href="#reference";a.onclick=ev=>{ev.preventDefault();document.getElementById("reference").scrollIntoView({behavior:smooth()})};eras.append(a)}

  function update(){
    let all=0,done=0;
    g.phases.forEach((p,pi)=>{let n=0;p.steps.forEach((_,ii)=>{if(state[`c${pi}-${ii}`])n++});all+=p.steps.length;done+=n;
      main.querySelector(`[data-c="${pi}"]`).textContent=`${n} / ${p.steps.length}`;
      eras.querySelector(`[data-n="${pi}"]`).classList.toggle("full",n===p.steps.length)});
    total.textContent=`${done} / ${all}`;fill.style.width=(all?done/all*100:0)+"%";
  }
  update();
  tg.onclick=()=>{const on=main.classList.toggle("hide-done");tg.textContent=on?"Show done":"Hide done"};
  rs.onclick=()=>{cf.hidden=false;rs.hidden=true};
  no.onclick=()=>{cf.hidden=true;rs.hidden=false};
  yes.onclick=()=>{state={};store(KEY,state);main.querySelectorAll("input").forEach(c=>{c.checked=false;c.closest("li").classList.remove("is-done")});update();cf.hidden=true;rs.hidden=false};
}
function route(){
  const h=location.hash.slice(1);
  if(h==="reference"){if(!main.childElementCount)show(GUIDES[0]?.slug);return}
  show(h);window.scrollTo({top:0});
}
addEventListener("hashchange",route);
route();
</script>
</body></html>
